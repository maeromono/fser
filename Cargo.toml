[package]
name = "fser"
version = "0.2.2"
authors = ["EnmakaiDev"]
edition = "2024"
license = "GPL-3.0"
description = "A dumbed-down TUI EPUB reader."
repository = "https://codeberg.org/enmkdev/fser"
homepage = "https://enmkdev.neocities.org/projects/fser/"
readme = "README.md"
keywords = ["tui", "epub", "reader"]
categories = ["command-line-interface", "command-line-utilities"]

[dependencies]
crossterm = "0.29.0"
directories = "6.0.0"
html2text = "0.17.1"
ratatui = "0.30.2"
rbook = "0.7.10"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
